[project]
name = "pumpwood-djangoauth"
version = "2.1.58-b.0"
description = "Assist creating views for Django using Pumpwood pattern."
readme = "README.md"
requires-python = ">=3.6,<4.0"
license = { text = "BSD-3-Clause License" }
authors = [
    {name = "Murabei Data Science", email = "a.baceti@murabei.com"}
]
urls = { Homepage = "https://github.com/Murabei-OpenSource-Codes/pumpwood-djangoauth" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "Django>=4.0.0",
    "djangorestframework>=3.13",
    "python-slugify>=8.0.1",
    "pandas>=1.3.1",
    "django-flat-json-widget>=0.1.3",
    "PyJWT>=2.7.0",
    "django-rest-knox==4.2.0",
    "pumpwood-communication>=1.0",
    "requests-oauthlib>=2.0.0",
    "pumpwood-kong",
    "twilio>=8.11.0",
    "pumpwood-miscellaneous"
]

[tool.poetry]
packages = [{include = "pumpwood_djangoauth", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 79
indent-width = 4

exclude = [
  "secrets/",
  "__init__.py",
  "setup_template.py",
  "setup.py"
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "D",
    "I",
    "PD",
    "N",
    "S",
]

ignore = [
  "E402", "N806", "I001"
]

preview = true

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
no-sections = true

[dependency-groups]
docs = [
    "mkdocs (>=1.6.1,<2.0.0)"
]
